<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カード学習</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="header">
    <button onclick="history.back()">← 戻る</button>
    <h1>カード学習</h1>
</header>

<!-- 結果表示モーダル -->
<div id="complete-modal" class="modal modal-hidden">
    <div class="modal-tag-content">
        <h2>学習完了 🎉</h2>
        
        <canvas id="result-chart" width="200" height="200"></canvas>
        <p>総単語数：<span id="total-count"></span></p>
        <p>覚えた：<span id="known-count"></span></p>
        <p>要復習：<span id="review-count"></span></p>

        <button id="restart-review">要復習のみ再学習</button>
        <button id="result-close">戻る</button>
    </div>
</div>


<main class="container">
    <progress id="progress-bar" value="1" max="20"></progress>
    <div id="progress-text">
        <span id="current-index">1</span> /
        <span id="total-count-card">0</span>
    </div>

    <div class="card-container">
        <div id="card" class="card">
            <div class="card-face card-front" id="card-front">
            </div>
            <div class="card-face card-back" id="card-back">
            </div>
        </div>
    </div>
    <button id="flip-btn" class="button-text">めくる</button>

    <!-- デバッグ用 -->
    <div class="debug-buttons">
        <button id="next-btn-left">←</button>
        <button id="next-btn-right">→</button>
    </div>

    <button id="undo-btn">1つ前に戻る</button>

    <div id="swipe-counter">
        <span class="review">要復習：<span id="review-count-live">0</span></span>
        <span class="known">覚えた：<span id="known-count-live">0</span></span>
    </div>

</main>

<script src="./data.js"></script>
<script src="./card.js"></script>
</body>
</html>
